<!DOCTYPE html>
<!-- 组合样例 1：强调词缩放/位移（纯声明式 HTML/CSS，无脚本、无外部引用） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>emphasis</title>
<style>
  :root { --ink:#ffffff; --hot:#ffe14d; --accent:#ff3b6b; }
  html,body { margin:0; padding:0; width:100%; height:100%; background:transparent; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif; overflow:hidden; }

  .stage {
    position:absolute; left:0; right:0; bottom:230px;
    display:flex; justify-content:center; align-items:flex-end;
  }
  .line {
    position:relative; display:flex; align-items:baseline; gap:0;
    font-size:74px; font-weight:800; letter-spacing:2px;
    color:var(--ink);
    text-shadow:0 6px 18px rgba(0,0,0,.55);
    animation: line-in 6000ms cubic-bezier(.22,.9,.28,1) both;
  }
  .ch { display:inline-block; animation: ch-in 240ms cubic-bezier(.2,.9,.3,1) both; }
  .c1{animation-delay:0ms}   .c2{animation-delay:70ms}  .c3{animation-delay:140ms}
  .c4{animation-delay:210ms} .c5{animation-delay:280ms} .c6{animation-delay:350ms}
  .c7{animation-delay:420ms} .c8{animation-delay:490ms} .c9{animation-delay:560ms}
  .c10{animation-delay:630ms}

  .emph {
    position:relative; display:inline-block; margin-left:6px;
    color:var(--ink);
    animation: emph-pop 6000ms cubic-bezier(.2,1.2,.25,1) both,
               emph-hue 6000ms linear both;
  }
  .emph::after {
    content:""; position:absolute; left:-2%; right:-2%; bottom:-14px; height:14px;
    background:linear-gradient(90deg,var(--accent),var(--hot));
    transform-origin:left center; border-radius:8px;
    animation: sweep 6000ms cubic-bezier(.2,.9,.3,1) both;
  }
  .glow {
    position:absolute; left:50%; bottom:150px; width:760px; height:360px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,59,107,.55), rgba(255,59,107,0) 70%);
    filter:blur(6px);
    animation: glow-pulse 2400ms ease-in-out infinite;
  }

  @keyframes line-in {
    0%   { opacity:0; transform:translateY(60px) scale(.94); }
    8%   { opacity:1; transform:translateY(0) scale(1); }
    92%  { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-40px) scale(.97); }
  }
  @keyframes ch-in {
    0%   { opacity:0; transform:translateY(38px) rotate(6deg); filter:blur(6px); }
    100% { opacity:1; transform:translateY(0) rotate(0deg); filter:blur(0); }
  }
  @keyframes emph-pop {
    0%,28%   { transform:scale(1) translateY(0); }
    36%      { transform:scale(1.42) translateY(-26px); }
    44%      { transform:scale(1.18) translateY(-10px); }
    52%      { transform:scale(1.30) translateY(-18px); }
    62%,100% { transform:scale(1.06) translateY(-4px); }
  }
  @keyframes emph-hue {
    0%,28%   { color:#ffffff; text-shadow:0 6px 18px rgba(0,0,0,.55); }
    38%      { color:#ffe14d; text-shadow:0 0 34px rgba(255,225,77,.95), 0 8px 22px rgba(0,0,0,.6); }
    70%      { color:#ff3b6b; text-shadow:0 0 26px rgba(255,59,107,.8), 0 8px 22px rgba(0,0,0,.6); }
    100%     { color:#ffd7e0; text-shadow:0 6px 18px rgba(0,0,0,.55); }
  }
  @keyframes sweep {
    0%,30% { transform:scaleX(0); opacity:0; }
    40%    { transform:scaleX(1); opacity:1; }
    88%    { transform:scaleX(1); opacity:1; }
    100%   { transform:scaleX(0); opacity:0; }
  }
  @keyframes glow-pulse {
    0%,100% { opacity:.35; transform:translateX(-50%) scale(.94); }
    50%     { opacity:.85; transform:translateX(-50%) scale(1.06); }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <div class="line">
      <span class="ch c1">这</span><span class="ch c2">个</span><span class="ch c3">价</span>
      <span class="ch c4">格</span><span class="ch c5">真</span><span class="ch c6">的</span>
      <span class="ch c7">绷</span><span class="ch c8">不</span><span class="ch c9">住</span>
      <span class="ch c10">了</span>
      <span class="emph">，冲</span>
    </div>
  </div>
</body>
</html>
