name: 原生平台发行能力验收

on:
  workflow_dispatch:
    inputs:
      target:
        description: 要执行的原生目标平台
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-intel
          - windows-x64
  push:
    branches:
      - codex/platform-release-validation
    paths:
      - ".github/workflows/platform-release-validation.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "resources/asr/**"
      - "scripts/build-asr-*"
      - "scripts/prepare-asr-*"
      - "scripts/verify-*-release-*"
      - "scripts/verify-clip-ffmpeg-capabilities.*"
      - "scripts/verify-macos-bundle-architecture.sh"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "ui/**"

permissions:
  contents: read

concurrency:
  group: platform-release-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_URL: https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n8.1.2
  FFMPEG_SHA256: 9fd092511605bbebafe095ea6d38d9e40f34d12f7386e1258372df8be0576eb7
  WHISPER_URL: https://codeload.github.com/ggml-org/whisper.cpp/tar.gz/f049fff95a089aa9969deb009cdd4892b3e74916
  WHISPER_SHA256: 279af4ce60dbf397362868f3bacc75b56a4332ac2541cae155070093f6aaf0e3
  ASR_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
  ASR_MODEL_SHA256: ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb
  VAD_MODEL_URL: https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
  VAD_MODEL_SHA256: 2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987
  VC_REDIST_URL: https://download.visualstudio.microsoft.com/download/pr/9d270333-8b7b-4f96-9458-6fcdb2ec0b25/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe
  VC_REDIST_SHA256: cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b

jobs:
  macos-intel:
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos-intel' }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装原生构建工具
        run: brew install jq nasm ripgrep cmake
      - name: 获取并校验锁定发行输入
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/dy-screen-input"
          common_root="$input_root/common"
          mkdir -p "$common_root/models" "$input_root/sources"
          cp -R resources/asr/. "$common_root/"
          download() {
            local name=$1 url=$2 output=$3 expected=$4 exit_code=0
            rm -f "$output"
            curl --silent --show-error --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 60 --max-time 3600 --proto '=https' --tlsv1.2 \
              --output "$output" "$url" || exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              printf '::error title=锁定发行输入下载失败::%s (curl exit %s)\n' "$name" "$exit_code"
              return "$exit_code"
            fi
            printf '%s  %s\n' "$expected" "$output" | shasum -a 256 -c -
          }
          download FFmpeg "$FFMPEG_URL" "$input_root/sources/FFmpeg-n8.1.2.tar.gz" "$FFMPEG_SHA256"
          download whisper.cpp "$WHISPER_URL" "$input_root/sources/whisper.cpp-v1.9.1.tar.gz" "$WHISPER_SHA256"
          download ASR-model "$ASR_MODEL_URL" "$common_root/models/ggml-small-q5_1.bin" "$ASR_MODEL_SHA256"
          download VAD-model "$VAD_MODEL_URL" "$common_root/models/ggml-silero-v6.2.0.bin" "$VAD_MODEL_SHA256"
      - name: 构建 macOS Intel 随包资源
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          input_root="$RUNNER_TEMP/dy-screen-input"
          build_root="$RUNNER_TEMP/dy-screen-build"
          source_root="$RUNNER_TEMP/dy-screen-source-macos-x86_64"
          stage_root="$RUNNER_TEMP/dy-screen-stage-macos-x86_64"
          ./scripts/build-asr-ffmpeg-macos.sh \
            "$input_root/sources/FFmpeg-n8.1.2.tar.gz" "$build_root/ffmpeg" x86_64
          ./scripts/build-asr-whisper-macos.sh \
            "$input_root/sources/whisper.cpp-v1.9.1.tar.gz" "$build_root/whisper" x86_64
          ./scripts/prepare-asr-resources-macos.sh \
            "$input_root/common" "$build_root/ffmpeg" "$build_root/whisper" \
            "$source_root" x86_64 2026.07.4
          cargo run --locked --bin asr-bundle -- stage \
            --source "$source_root" --target "$stage_root" \
            --platform macos-x86-64 --channel development
      - name: 构建含资源的 Intel 应用候选
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          stage_root="$RUNNER_TEMP/dy-screen-stage-macos-x86_64"
          config="$RUNNER_TEMP/tauri.macos.resources.x86_64.json"
          ./scripts/generate-tauri-macos-resource-config.sh "$stage_root" "$config"
          DY_SCREEN_API_BASE_URL='https://api.invalid/' \
          DY_SCREEN_RESOURCE_BASE_URL='https://resources.invalid/development/0.3.0/macos/x86_64/2026.07.4/' \
            npm run tauri:build -- --ci \
              --config src-tauri/tauri.macos.conf.json \
              --config "$config" \
              --target x86_64-apple-darwin \
              --bundles app
      - name: 执行 macOS Intel 原生资源与媒体验收
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/platform-validation
          ./scripts/verify-platform-release-macos.sh \
            'src-tauri/target/x86_64-apple-darwin/release/bundle/macos/切片智能体.app' \
            'dist/platform-validation/macos-intel.json'
          jq -e '.nativeHost == true and .allPassed == true and (.steps | length) == 7' \
            dist/platform-validation/macos-intel.json
      - name: 上传 macOS Intel 候选和证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-macos-intel-${{ github.run_id }}
          path: |
            dist/platform-validation/
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/切片智能体.app/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-x64:
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 MSYS2 UCRT64 构建工具
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & C:\msys64\usr\bin\bash.exe -lc `
            "pacman -Sy --noconfirm --needed make diffutils pkgconf nasm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zlib"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 UCRT64 工具安装失败。" }
      - name: 获取并校验锁定发行输入
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $inputRoot = Join-Path $env:RUNNER_TEMP "dy-screen-input"
          $commonRoot = Join-Path $inputRoot "common"
          New-Item -ItemType Directory -Force -Path (Join-Path $commonRoot "models"), (Join-Path $inputRoot "sources") | Out-Null
          Copy-Item -Path "resources\asr\*" -Destination $commonRoot -Recurse -Force
          function Download-Verified([string]$Name, [string]$Url, [string]$Output, [string]$Expected) {
            Remove-Item -LiteralPath $Output -Force -ErrorAction SilentlyContinue
            $previousErrorActionPreference = $ErrorActionPreference
            $curlExitCode = -1
            try {
              # Suppress curl's progress stderr and keep native failure handling exit-code based.
              $ErrorActionPreference = "Continue"
              & curl.exe --silent --show-error --fail --location --retry 5 --retry-all-errors `
                --connect-timeout 60 --max-time 3600 --proto "=https" --tlsv1.2 --output $Output $Url
              $curlExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            if ($curlExitCode -ne 0) {
              Write-Host "::error title=锁定发行输入下载失败::$Name (curl exit $curlExitCode)"
              throw "发行输入下载失败：$Name"
            }
            $actual = (Get-FileHash -LiteralPath $Output -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) {
              Write-Host "::error title=锁定发行输入完整性失败::$Name SHA-256 不匹配"
              throw "发行输入 SHA-256 不匹配：$Name"
            }
          }
          Download-Verified "FFmpeg" $env:FFMPEG_URL (Join-Path $inputRoot "sources\FFmpeg-n8.1.2.tar.gz") $env:FFMPEG_SHA256
          Download-Verified "whisper.cpp" $env:WHISPER_URL (Join-Path $inputRoot "sources\whisper.cpp-v1.9.1.tar.gz") $env:WHISPER_SHA256
          Download-Verified "ASR model" $env:ASR_MODEL_URL (Join-Path $commonRoot "models\ggml-small-q5_1.bin") $env:ASR_MODEL_SHA256
          Download-Verified "VAD model" $env:VAD_MODEL_URL (Join-Path $commonRoot "models\ggml-silero-v6.2.0.bin") $env:VAD_MODEL_SHA256
          Download-Verified "VC++ x64 runtime" $env:VC_REDIST_URL (Join-Path $inputRoot "vc_redist.x64.exe") $env:VC_REDIST_SHA256
      - name: 构建 Windows x64 随包资源
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          function ConvertTo-CiAnnotationValue([string]$Value) {
            $sanitized = $Value
            foreach ($root in @($env:RUNNER_TEMP, $env:GITHUB_WORKSPACE)) {
              if (-not [string]::IsNullOrWhiteSpace($root)) {
                $sanitized = $sanitized.Replace($root, "<runner-path>")
              }
            }
            return $sanitized.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          }
          function Invoke-NativeStage([string]$Name, [scriptblock]$Action) {
            $nativeOutput = @()
            try {
              & $Action 2>&1 | Tee-Object -Variable nativeOutput
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) { throw "$Name 退出码为 $exitCode。" }
            } catch {
              $diagnostic = @($nativeOutput |
                ForEach-Object { [string]$_ } |
                Where-Object { $_ -match "(?i)(error|failed|mismatch|invalid|missing|not found|拒绝|失败|不一致|缺少|无效)" } |
                Select-Object -Last 5) -join " | "
              if ([string]::IsNullOrWhiteSpace($diagnostic)) {
                $diagnostic = [string]$_.Exception.Message
              }
              $diagnostic = ConvertTo-CiAnnotationValue $diagnostic
              Write-Host "::error title=Windows x64 资源构建失败::$Name, diagnostic=$diagnostic"
              throw
            }
          }
          function Invoke-PowerShellStage([string]$Name, [scriptblock]$Action) {
            try {
              & $Action
            } catch {
              $diagnostic = ConvertTo-CiAnnotationValue ([string]$_.Exception.Message)
              Write-Host "::error title=Windows x64 资源构建失败::$Name, diagnostic=$diagnostic"
              throw
            }
          }
          Invoke-NativeStage "root-cargo-fetch" { cargo fetch --locked }
          Invoke-NativeStage "tauri-cargo-fetch" { cargo fetch --locked --manifest-path src-tauri/Cargo.toml }
          Invoke-PowerShellStage "visual-studio-environment" {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $script:vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($script:vsRoot)) {
              throw "找不到 Visual Studio x64 C++ 工具。"
            }
            Import-Module (Join-Path $script:vsRoot "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
            Enter-VsDevShell -VsInstallPath $script:vsRoot -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          }
          $inputRoot = Join-Path $env:RUNNER_TEMP "dy-screen-input"
          $buildRoot = Join-Path $env:RUNNER_TEMP "dy-screen-build"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "dy-screen-source-windows-x64"
          Invoke-PowerShellStage "ffmpeg-build" {
            & .\scripts\build-asr-ffmpeg-windows.ps1 `
              -SourceArchive (Join-Path $inputRoot "sources\FFmpeg-n8.1.2.tar.gz") `
              -OutputRoot (Join-Path $buildRoot "ffmpeg")
          }
          Invoke-PowerShellStage "whisper-build" {
            & .\scripts\build-asr-whisper-windows.ps1 `
              -SourceArchive (Join-Path $inputRoot "sources\whisper.cpp-v1.9.1.tar.gz") `
              -OutputRoot (Join-Path $buildRoot "whisper")
          }
          Invoke-PowerShellStage "resource-assembly" {
            & .\scripts\prepare-asr-resources-windows.ps1 `
              -CommonSource (Join-Path $inputRoot "common") `
              -FfmpegRoot (Join-Path $buildRoot "ffmpeg") `
              -WhisperRoot (Join-Path $buildRoot "whisper") `
              -VcRedist (Join-Path $inputRoot "vc_redist.x64.exe") `
              -VcLicense "resources\asr\licenses\Microsoft-VCRedist.txt" `
              -OutputRoot $sourceRoot `
              -BundleVersion "2026.07.4"
          }
          Invoke-NativeStage "asr-bundle-stage" {
            cargo run --locked --bin asr-bundle -- stage `
              --source $sourceRoot --target "resources\asr-stage" `
              --platform windows-x86-64 --channel development
          }
      - name: 构建含资源的 Windows NSIS 候选
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          function ConvertTo-CiAnnotationValue([string]$Value) {
            $sanitized = $Value
            foreach ($root in @($env:RUNNER_TEMP, $env:GITHUB_WORKSPACE)) {
              if (-not [string]::IsNullOrWhiteSpace($root)) {
                $sanitized = $sanitized.Replace($root, "<runner-path>")
              }
            }
            return $sanitized.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          }
          $packageOutput = @()
          $installerOutput = @()
          $installerLog = Join-Path $env:RUNNER_TEMP "dy-screen-windows-installer.log"
          try {
            & npm.cmd ci 2>&1 | Tee-Object -Variable packageOutput
            $npmExitCode = $LASTEXITCODE
            if ($npmExitCode -ne 0) { throw "npm ci 退出码为 $npmExitCode。" }
            $installerOutput = @(& .\scripts\build-windows-installer.ps1 `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -Mode Development `
              -ResourceBaseUrl "https://resources.invalid/development/0.3.0/windows/x86_64/2026.07.4/" `
              *>&1 | Tee-Object -FilePath $installerLog)
          } catch {
            if (Test-Path -LiteralPath $installerLog -PathType Leaf) {
              $installerOutput = @(Get-Content -LiteralPath $installerLog -Encoding UTF8)
            }
            $diagnosticLines = @($packageOutput) + @($installerOutput)
            $diagnostic = @($diagnosticLines |
              ForEach-Object { [string]$_ } |
              Where-Object { $_ -match "(?i)(error|failed|failure|invalid|missing|not found|refused|拒绝|失败|不一致|缺少|无效)" } |
              Select-Object -Last 12) -join " | "
            if ([string]::IsNullOrWhiteSpace($diagnostic)) {
              $diagnostic = @($installerOutput | Select-Object -Last 12) -join " | "
            }
            if ([string]::IsNullOrWhiteSpace($diagnostic)) {
              $diagnostic = [string]$_.Exception.Message
            }
            $diagnostic = ConvertTo-CiAnnotationValue $diagnostic
            Write-Host "::error title=Windows x64 NSIS 构建失败::diagnostic=$diagnostic"
            throw
          }
      - name: 执行 Windows x64 原生安装、资源与媒体验收
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $installDirectory = Join-Path $env:RUNNER_TEMP "dy-screen-platform-validation-install"
          $installer = Get-ChildItem -LiteralPath "src-tauri\target\release\bundle\nsis" `
            -Filter "*.exe" -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw "没有找到 NSIS 候选。" }
          New-Item -ItemType Directory -Force -Path "dist\platform-validation" | Out-Null
          & .\scripts\verify-platform-release-windows.ps1 `
            -Installer $installer.FullName `
            -InstallDirectory $installDirectory `
            -Output "dist\platform-validation\windows-x64.json" `
            -RepoRoot $env:GITHUB_WORKSPACE
          $report = Get-Content -LiteralPath "dist\platform-validation\windows-x64.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $report.nativeHost -or -not $report.allPassed -or @($report.steps).Count -ne 8) {
            throw "Windows x64 平台发行证据不完整。"
          }
      - name: 上传 Windows x64 候选和证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-windows-x64-${{ github.run_id }}
          path: |
            dist/platform-validation/
            dist/windows/
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
