[package]
name = "dy-screen"
version = "0.1.0"
edition = "2024"
default-run = "dy-screen"
description = "Tauri-compatible Douyin multi-room recording feasibility demo"
license = "MIT"

[lib]
name = "dy_screen"
path = "src/lib.rs"

[[bin]]
name = "dy-screen"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
ring = "0.17"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
